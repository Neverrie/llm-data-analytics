services:
  backend:
    build: ./backend
    container_name: llm-analytics-backend
    env_file:
      - .env
    ports:
      - "8003:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./datasets:/datasets
      - ./outputs:/outputs
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DATASETS_DIR: /datasets
      OUTPUTS_DIR: /outputs
      HOST_OUTPUTS_DIR: ${HOST_OUTPUTS_DIR:-}
      HOST_DATASETS_DIR: ${HOST_DATASETS_DIR:-}
      SANDBOX_DOCKER_IMAGE: ${SANDBOX_DOCKER_IMAGE:-llm-data-analytics-sandbox:latest}
      SANDBOX_DOCKER_USER: ${SANDBOX_DOCKER_USER:-1000:1000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3003,http://127.0.0.1:3003}

  sandbox-runner-image:
    build:
      context: ./backend
      dockerfile: sandbox.Dockerfile
    image: llm-data-analytics-sandbox:latest
    container_name: llm-analytics-sandbox-image
    command: ["tail", "-f", "/dev/null"]

  frontend:
    build: ./frontend
    container_name: llm-analytics-frontend
    ports:
      - "3003:3000"
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
