services:
  backend:
    build: ./backend
    container_name: llm-analytics-backend
    env_file:
      - .env
    ports:
      - "8003:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./datasets:/datasets
      - ./outputs:/outputs
    environment:
      DATASETS_DIR: /datasets
      OUTPUTS_DIR: /outputs
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3003,http://127.0.0.1:3003}

  frontend:
    build: ./frontend
    container_name: llm-analytics-frontend
    ports:
      - "3003:3000"
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
