services:
  backend:
    build: ./backend
    container_name: llm-analytics-backend
    env_file:
      - .env
    ports:
      - "8003:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./datasets:/datasets
      - ./outputs:/outputs
      # Dev-only: backend uses host Docker daemon for disposable sandbox containers.
      # Production should use a dedicated sandbox-manager service instead of docker.sock mount.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-oss-120b:free}
      OPENROUTER_FALLBACK_MODELS: ${OPENROUTER_FALLBACK_MODELS:-openai/gpt-oss-20b:free}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3:8b
      LAB2_DATASET_FILENAME: customer_reviews
      LAB3_PLANNER_MODEL: qwen3:8b
      LAB3_TOOL_CALLER_MODEL: qwen2.5-coder:7b
      LAB3_CRITIC_MODEL: deepseek-r1:8b
      LAB3_CODE_INTERPRETER_ENGINE: ${LAB3_CODE_INTERPRETER_ENGINE:-tool_calling}
      DATASETS_DIR: /datasets
      OUTPUTS_DIR: /outputs
      HOST_OUTPUTS_DIR: ${HOST_OUTPUTS_DIR:-}
      HOST_DATASETS_DIR: ${HOST_DATASETS_DIR:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3003,http://127.0.0.1:3003,http://82.162.61.44:3003}
      SANDBOX_RUNNER_MODE: ${SANDBOX_RUNNER_MODE:-docker}
      SANDBOX_DOCKER_IMAGE: ${SANDBOX_DOCKER_IMAGE:-llm-data-analytics-sandbox:latest}
      SANDBOX_DOCKER_USER: ${SANDBOX_DOCKER_USER:-1000:1000}
      SANDBOX_ALLOW_ROOT_RETRY: ${SANDBOX_ALLOW_ROOT_RETRY:-false}

  sandbox-runner-image:
    build:
      context: ./backend
      dockerfile: sandbox.Dockerfile
    image: llm-data-analytics-sandbox:latest
    container_name: llm-analytics-sandbox-image
    command: ["tail", "-f", "/dev/null"]

  frontend:
    build: ./frontend
    container_name: llm-analytics-frontend
    ports:
      - "3003:3000"
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}


